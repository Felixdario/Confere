# Termos que a anonimização NUNCA apaga quando aparecem sozinhos, mesmo que sejam parte do nome da
# pessoa (ADR 0004, rodada 2 da fase 2). Apagar um deles muda a evidência profissional e, portanto,
# a nota: seria viés pelo nome (quem se chama Julia perderia a competência Julia). Deixar um
# primeiro nome sozinho no corpo não muda nada, porque a nota não lê nome.
#
# A lista se soma aos termos de uma palavra da taxonomia (`taxonomia.yaml`). Comparação sem acento
# e sem caixa. A sequência de duas ou mais partes do nome ("Julia Martins") continua saindo sempre.
versao: 1


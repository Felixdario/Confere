# Taxonomia de competências (ADR 0002).
#
# - `canonica`: o nome que aparece na tela e nas evals.
# - `sinonimos`: grafias, abreviações e traduções da MESMA competência ("Postgres", "k8s", "MS Excel").
#   Abreviação comum precisa estar aqui: o embedding não a reconhece (ADR 0002, medições).
# - `relacionadas`: competências próximas que valem "parcial" (Vue para quem pede React). Só a
#   taxonomia decide "relacionada"; a relação é simétrica e cada nome precisa ser uma canônica.
#
# A comparação normaliza caixa, acentos, espaços e pontuação nas pontas (exceto # e +).
# A carga valida: nenhum termo em duas entradas, relacionadas existentes e simétricas.
# Mantenha as entradas em ordem alfabética dentro de cada categoria.

